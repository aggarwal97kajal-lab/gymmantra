name: mobile
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mobile
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - name: Create Android project files (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.gymmantra --project-name gymmantra --platforms android --no-pub .
            echo "NEW_ANDROID=1" >> "$GITHUB_ENV"
          fi
      - run: bash tool/configure_android.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE="$(cat api_base.txt)"
      - name: Sign with the GymMantra pilot key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks signing/gymmantra-pilot.jks --ks-key-alias gymmantra \
            --ks-pass "pass:$(cat signing/password.txt)" --key-pass "pass:$(cat signing/password.txt)" \
            --out GymMantra.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify GymMantra.apk
          ls -la GymMantra.apk
      - name: Save generated Android files to the repo
        if: env.NEW_ANDROID == '1'
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add android pubspec.lock .metadata .gitignore 2>/dev/null || true
          git commit -m "chore: add generated Android project files [skip ci]" && git pull --rebase && git push || true
      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-build-${{ github.run_number }}" GymMantra.apk \
            --title "GymMantra app · build ${{ github.run_number }}" \
            --notes "Android app for gym members. Download GymMantra.apk on your phone and install it. Server: $(cat api_base.txt)" \
            --latest
