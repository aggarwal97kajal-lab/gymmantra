name: probe
# Checks the live server from GitHub (the dev sandbox cannot reach it).
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=$(echo "https://gymmantra.aggarwal97kajal.workers.dev")
          for p in /api/v1/auth/config /api/v1/saas-plans /api/setup-check; do
            echo "== $p"; curl -s -m 40 -o /tmp/o -w "status %{http_code} time %{time_total}s\n" "$B$p"; head -c 400 /tmp/o; echo
          done
          echo "== login (bad password)"
          curl -s -m 40 -w "\nstatus %{http_code} time %{time_total}s\n" -H 'content-type: application/json' -H 'x-gm-client: mobile' -d '{"identifier":"probe@example.com","password":"x"}' "$B/api/v1/auth/login" | head -c 600
