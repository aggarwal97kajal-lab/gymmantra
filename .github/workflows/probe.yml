name: probe
# Checks the live server from GitHub (the dev sandbox cannot reach it).
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B="https://gymmantra.aggarwal97kajal.workers.dev"
          for n in 1 2 3; do
            curl -s -m 60 -o /dev/null -w "config $n: %{http_code} %{time_total}s\n" "$B/api/v1/auth/config"
            curl -s -m 60 -o /tmp/o -w "login $n: %{http_code} %{time_total}s " -H 'content-type: application/json' -H 'x-gm-client: mobile' -d '{"identifier":"probe'$n'@example.com","password":"x"}' "$B/api/v1/auth/login"; head -c 150 /tmp/o; echo
            curl -s -m 60 -o /tmp/o -w "me-noauth $n: %{http_code} %{time_total}s " -H 'x-gm-client: mobile' -H 'Authorization: Bearer abc' "$B/api/v1/auth/me"; head -c 150 /tmp/o; echo
            curl -s -m 60 -o /tmp/o -w "lookup $n: %{http_code} %{time_total}s " -H 'x-gm-client: mobile' "$B/api/v1/me/gym-lookup?code=LIFE951"; head -c 150 /tmp/o; echo
          done
