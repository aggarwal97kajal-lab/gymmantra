name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: gm, POSTGRES_PASSWORD: gm, POSTGRES_DB: gymmantra_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gm:gm@localhost:5432/gymmantra_test
      DATABASE_URL: postgresql://gm:gm@localhost:5432/gymmantra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gymmantra/api exec prisma generate
      - run: pnpm --filter @gymmantra/api typecheck
      - run: pnpm --filter @gymmantra/api test
      - run: pnpm --filter @gymmantra/api build
  admin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gymmantra/admin build
