name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @gymmantra/worker typecheck
      - run: pnpm --filter @gymmantra/worker test
      - name: Same API tests on the D1 database (SQLite)
        run: cd apps/worker && TEST_STORE=d1 npx jest --runInBand test/api.test.ts test/security.test.ts test/d1.test.ts
      - name: Build admin panel and static assets
        run: pnpm run build:cf
      - run: test -f apps/worker/public/index.html && test -f apps/worker/public/members/view/index.html && test -f apps/worker/public/media/exercises/exercises.json
      - name: Check the Cloudflare bundle (no upload)
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-out

  firebase-emulator:
    # Same API tests, but against the real Firebase Auth + Firestore adapters and firestore.rules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: pnpm install --no-frozen-lockfile
      - name: API tests on the Firebase emulators
        run: npx -y firebase-tools@13.29.1 emulators:exec --only auth,firestore --project demo-gymmantra "cd apps/worker && FIREBASE_EMULATOR=1 npx jest --runInBand --verbose --forceExit --testTimeout=20000 test/rules.test.ts test/api.test.ts"
      - name: Emulator logs
        if: always()
        run: tail -n 80 firestore-debug.log 2>/dev/null || true
