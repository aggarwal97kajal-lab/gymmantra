name: guide-shots
# Real app screens for the user guide: a demo gym on a local server, the app drawn in a Flutter test.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Demo server
        run: |
          cd apps/worker
          GUIDE_OUT=/tmp/guide-logins.json PORT=8787 nohup npx tsx scripts/guide.ts > /tmp/guide-server.log 2>&1 &
          for i in $(seq 1 60); do test -f /tmp/guide-logins.json && break; sleep 1; done
          cat /tmp/guide-server.log
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Draw the screens
        working-directory: apps/mobile
        continue-on-error: true
        run: |
          flutter pub get
          GUIDE_LOGINS=/tmp/guide-logins.json flutter test test_guide/guide_shots_test.dart --update-goldens --reporter expanded > /tmp/shots.log 2>&1 || true
          mkdir -p test_guide/shots && cp /tmp/shots.log test_guide/shots/log.txt
      - run: ls -la apps/mobile/test_guide/shots || true
      - name: Keep the pictures on the guide-shots branch
        run: |
          cd apps/mobile/test_guide/shots
          git init -q -b guide-shots
          git config user.name "guide bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "guide screens"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" guide-shots
