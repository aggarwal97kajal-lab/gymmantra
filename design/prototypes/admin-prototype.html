<title>GymMantra Admin Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: gym admin panel (sidebar · workspace) with a live member-app phone preview on the right. Deliberately single dark look matching the GymMantra designs. */
:root{
  --bg:#0F1110; --side:#0B0D0C; --card:#181B19; --card2:#202421; --field:#121413; --line:#2A2F2B;
  --fg:#F3F6F1; --mut:#8C948D; --dim:#5E655F;
  --lime:#C8FF3E; --limeD:rgba(200,255,62,.14); --limeB:#3A4A20;
  --org:#FF7A2F; --orgD:rgba(255,122,47,.15); --red:#FF5A5A; --redD:rgba(255,90,90,.14); --blue:#5BB9FF; --blueD:rgba(91,185,255,.14);
  --wa:#6EE59A; --waD:#1F3B2A;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 380px;height:100%;min-height:0}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--lime);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.2px}
.brand small{color:var(--mut);font-size:11.5px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:0;background:none;color:var(--mut);font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--card)}
.nav[aria-current="page"]{background:var(--limeD);color:var(--lime);font-weight:650}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--orgD);color:var(--org)}
.sidefoot{margin-top:auto;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut);line-height:1.45}
.sidefoot button{margin-top:8px;background:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--mut);font-size:12px}
/* main */
.main{overflow:auto;min-height:0;padding:24px 28px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.crumb{color:var(--mut);font-size:13px;font-weight:600}
h1{font-size:28px;letter-spacing:-.6px;margin:2px 0 0;font-weight:750}
h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.mut{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:12px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--lime);color:#0F1110;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.wa{background:var(--waD);color:var(--wa)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:var(--limeD);color:var(--lime)} .warn{background:var(--orgD);color:var(--org)} .bad{background:var(--redD);color:var(--red)} .off{background:#23272A;color:var(--mut)} .info{background:var(--blueD);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .k{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.tab span{font-size:11.5px;padding:1px 7px;border-radius:7px;background:var(--card2)}
.tab[aria-pressed="true"]{background:var(--lime);color:#111;border-color:var(--lime)}
.tab[aria-pressed="true"] span{background:rgba(0,0,0,.14)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:240px}
.search input{background:none;border:0;outline:0;height:40px;flex:1;min-width:0}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.3px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.02)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--mut)}
.inp{height:42px;border-radius:11px;background:var(--field);border:1px solid var(--line);padding:0 12px;width:100%;outline:0}
.inp:focus{border-color:#5E7A2A;box-shadow:0 0 0 3px rgba(200,255,62,.12)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.seg{display:flex;flex-wrap:wrap;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;color:var(--mut);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--lime);color:#111}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13px}
.chk input{accent-color:#C8FF3E;width:16px;height:16px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.price{font-size:28px;font-weight:800;letter-spacing:-.8px}
.chip{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:11.5px;font-weight:600}
.switch{width:42px;height:24px;border-radius:12px;background:#2A2F2B;border:0;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8C948D;transition:left .15s}
.switch[aria-checked="true"]{background:var(--lime)} .switch[aria-checked="true"]::after{left:21px;background:#111}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--limeD);border:1px solid var(--limeB);font-size:13px;line-height:1.45}
.hint.o{background:var(--orgD);border-color:rgba(255,122,47,.28)}
.hint.r{background:rgba(255,90,90,.08);border-color:rgba(255,90,90,.24)}
.err{color:var(--red);font-size:12px;min-height:16px}
.layout2{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.layout2.la{grid-template-columns:360px minmax(0,1fr)}
.layout2.ls{grid-template-columns:320px minmax(0,1fr)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.layout2,.layout2.la,.layout2.ls{grid-template-columns:minmax(0,1fr)}}
.scan{height:200px;border-radius:16px;background:radial-gradient(60% 60% at 50% 50%,#26302A,#121513);display:grid;place-items:center;position:relative;overflow:hidden}
.scan .box{width:130px;height:130px;position:relative}
.scan .box i{position:absolute;width:28px;height:28px;border:0 solid var(--lime)}
.scan .line{position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--lime);box-shadow:0 0 14px var(--lime);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-50px)}50%{transform:translateY(50px)}}
.result{border-radius:16px;padding:16px;border:1.5px solid}
.chat{display:flex;flex-direction:column;gap:10px;padding:16px;min-height:300px}
.msg{max-width:78%;padding:11px 13px;border-radius:15px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--lime);color:#111;border-bottom-right-radius:5px;font-weight:500}
.msg.them{background:var(--card2);border-bottom-left-radius:5px}
.msg .t{font-size:11.5px;opacity:.6;margin-top:5px}
.tlist button{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:13px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.tlist button[aria-current="true"]{background:var(--limeD);border-color:var(--limeB)}
/* phone preview */
.preview{border-left:1px solid var(--line);background:radial-gradient(80% 50% at 50% 30%,rgba(200,255,62,.06),transparent),#0C0E0D;padding:20px 18px;overflow:auto;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.preview .lbl{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--lime)}
.phone{width:340px;max-width:100%;border-radius:44px;padding:10px;background:#1E211F;box-shadow:0 0 0 1.5px #2E332F,0 30px 70px rgba(0,0,0,.55)}
.screen{border-radius:35px;background:var(--bg);height:640px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:600;flex:none}
.pbody{flex:1;overflow:auto;padding:4px 16px 16px}
.ptabs{display:flex;margin:10px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;flex:none}
.ptabs button{flex:1;border:0;background:none;padding:9px;border-radius:12px;font-weight:600;font-size:12.5px;color:var(--mut)}
.ptabs button[aria-pressed="true"]{background:var(--limeD);color:var(--lime)}
.mcard{border-radius:22px;padding:16px;background:linear-gradient(145deg,#D4FF5C 0%,#A8E62E 55%,#7BC425 100%);color:#111;position:relative;overflow:hidden}
.mcard.exp{background:linear-gradient(145deg,#3A2A22,#2A1F1A);color:var(--fg);border:1px solid rgba(255,122,47,.3)}
.mcard.none{background:var(--card);color:var(--fg);border:1px dashed var(--dim)}
.prow{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.prow:first-child{border-top:0}
.notif{position:absolute;left:10px;right:10px;top:42px;z-index:5;border-radius:18px;padding:11px 12px;background:rgba(30,34,31,.97);border:1px solid var(--limeB);box-shadow:0 16px 36px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center;transform:translateY(-140%);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.notif.show{transform:none;opacity:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:#F3F6F1;color:#111;font-weight:650;padding:12px 18px;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:transform .3s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:#151816}
.mobtoggle{display:none}
@media (prefers-reduced-motion:reduce){.scan .line{animation:none}.notif,.toast{transition:none}}
@media (max-width:1480px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .preview{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);z-index:30;transform:translateX(100%);transition:transform .3s;box-shadow:-20px 0 60px rgba(0,0,0,.5);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .preview.open{transform:none}
  .mobtoggle{display:inline-flex}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:auto;min-height:100%}
  .side{flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:6px;position:sticky;top:0;z-index:10}
  .brand,.sidefoot{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 12px}
  .nav svg{display:none}
  .main{padding:18px 16px 40px;overflow:visible}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3,.grid2{grid-template-columns:minmax(0,1fr)}
  h1{font-size:24px}
}
</style>

<div class="app">
  <nav class="side" aria-label="Admin sections">
    <div class="brand"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg></i><div><b>GymMantra</b><small>Ironline Fitness · Admin</small></div></div>

</div>

<script>
(() => {
const TODAY = new Date(2026,10,1);
const KEY = 'gymmantra-admin-proto-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {

  check:'<path d="M5 12l5 5 9-10"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>',

// ---------- dates & money
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmt = s => parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };

        <div class="row">${avatar(m.name,48)}<div style="flex:1"><div style="font-weight:800;font-size:17px">${esc(m.name)}</div><div class="small mut num">${m.id} · ${c?esc(plan(c.planId)?.name):'No plan'}</div></div><span class="av" style="background:${ok?'var(--lime)':'var(--red)'}">${ic(ok?'check':'x',18,'#111',3)}</span></div>
        <div style="margin-top:10px;font-weight:700;color:${ok?'var(--lime)':'var(--red)'}">${esc(s.text)} · ${s.time}</div>
        ${ok?'':`<button class="btn sm" type="button" data-member="${m.id}" style="margin-top:10px">Renew now</button>`}</div>`})() : ''}
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card kpi"><div class="k">Check-ins today</div><div class="v num">${stats.total}</div></div><div class="card kpi"><div class="k">In the gym now</div><div class="v num" style="color:var(--lime)">82</div></div><div class="card kpi"><div class="k">Blocked today</div><div class="v num" style="color:var(--red)">${stats.blocked}</div></div></div>
      <div class="card" style="padding:12px 14px"><div class="row sp" style="padding:4px 4px 6px"><h2>Latest check-ins</h2><span class="small mut">Live</span></div>
      <div class="tblwrap"><table><thead><tr><th>TIME</th><th>MEMBER</th><th>PLAN</th><th>RESULT</th></tr></thead><tbody>${S.checkins.map(ci=>{const m=member(ci.id), c=cur(m); return `<tr><td class="num mut">${ci.time}</td><td><div class="row">${avatar(m.name,30)}<span style="font-weight:600">${esc(m.name)}</span></div></td><td class="mut">${c?esc(plan(c.planId)?.name):'—'}</td><td><span class="pill ${ci.result}">${esc(ci.text)}</span></td></tr>`}).join('')}</tbody></table></div></div>
    </div>
  </div>`;
}

function vSupport(){
  const t = S.tickets.find(x=>x.id===ticketId) || S.tickets[0];
  const m = member(t.member);
  return header('Ironline Fitness','Member support') + `
  <div class="layout2 ls">
    <div class="card tlist" style="padding:8px">${S.tickets.map(x=>{const mm=member(x.member);return `<button type="button" data-ticket="${x.id}" aria-current="${x.id===t.id}">${avatar(mm.name,34)}<span style="flex:1;min-width:0"><b style="display:block;font-size:14px">${esc(mm.name)}</b><span class="small mut" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.subject)}</span></span><span class="pill ${x.open?'warn':'ok'}" style="font-size:11px">${x.open?'Open':'Resolved'}</span></button>`}).join('')}
      <p class="small dim" style="padding:8px 10px;line-height:1.5;margin:6px 0 0">App problems go to GymMantra support. You only see questions about your gym.</p></div>
    <div class="card" style="padding:0;display:flex;flex-direction:column;min-width:0">
      <div class="row sp wrap" style="padding:14px 16px;border-bottom:1px solid var(--line)"><div class="row">${avatar(m.name)}<div><b>${esc(m.name)}</b><div class="small mut num">#${t.id} · ${esc(t.topic)}</div></div></div>
        <div class="row"><button class="btn ghost sm" type="button" data-member="${m.id}">Open member</button>${t.open?`<button class="btn sm" type="button" data-resolve="${t.id}">Mark resolved</button>`:'<span class="pill ok">Resolved</span>'}</div></div>
      <div class="chat">${t.msgs.map(x=>`<div class="msg ${x.me?'me':'them'}">${esc(x.text)}<div class="t">${x.me?esc(x.by||'Priya')+' · ':''}${esc(x.t)}</div></div>`).join('')}</div>
      <div style="padding:12px 16px;border-top:1px solid var(--line)">
        <div class="row wrap" style="gap:6px;margin-bottom:10px">${["Thanks, we've fixed it","Please visit the front desk","We'll call you shortly"].map(x=>`<button class="tab" type="button" data-quick="${esc(x)}" style="font-size:12px;padding:6px 10px">${x}</button>`).join('')}</div>
        <div class="row"><input class="inp" id="reply" placeholder="Write a reply…" aria-label="Reply"><button class="btn" type="button" data-act="send" aria-label="Send reply">${ic('send',16,'#111',2.2)}</button></div>
      </div>
    </div>
  </div>`;
}

// ---------- member app preview
let pvTab = 'membership', notifT;
function renderPhone(note){
  const sel = $('#pvSel');
  sel.innerHTML = S.members.map(m=>`<option value="${m.id}" ${m.id===S.pv?'selected':''}>${esc(m.name)}</option>`).join('');
  const m = member(S.pv) || S.members[0];
  const c = cur(m), s = status(m), p = c && plan(c.planId);
  let inner;
  if (pvTab==='membership'){
    const pct = c ? Math.max(0, Math.min(1, s.days / Math.max(1, daysLeft(c.end) - daysLeft(c.start)))) : 0;
    const C = 2*Math.PI*21;
    const card = !c ? `<div class="mcard none"><b style="font-size:17px">No membership yet</b><p class="mut small" style="margin:6px 0 0;line-height:1.45">Your gym will add your plan after you pay at the front desk.</p></div>`
      : s.k==='expired' ? `<div class="mcard exp"><div style="font-weight:800;letter-spacing:2px;font-size:11px;opacity:.75">IRONLINE FITNESS</div><div style="font-size:21px;font-weight:800;margin-top:12px">${esc(p.name)}</div><div class="small" style="opacity:.7">${esc(m.name)} · ${m.id}</div><div style="margin-top:12px;font-weight:800;font-size:18px;color:var(--org)">Expired on ${fmt(c.end)}</div></div>`
      : `<div class="mcard"><div class="row sp"><div style="font-weight:800;letter-spacing:2px;font-size:11px">IRONLINE FITNESS</div><div style="font-weight:700;font-size:11px;opacity:.7">Indiranagar</div></div><div style="font-size:21px;font-weight:800;margin-top:12px;letter-spacing:-.3px">${esc(p.name)}</div><div style="font-size:12px;font-weight:600;opacity:.7">${esc(m.name)} · ${m.id}</div>
         <div class="row" style="margin-top:12px"><svg width="50" height="50" viewBox="-25 -25 50 50" aria-hidden="true"><circle r="21" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="5"/><circle r="21" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90)"/></svg><div><div class="num" style="font-size:21px;font-weight:800;line-height:1">${s.days} days left</div><div class="num" style="font-size:11.5px;font-weight:600;opacity:.65;margin-top:3px">${fmt(c.start)} → ${fmt(c.end)}</div></div></div></div>`;
    inner = `<div class="row sp" style="margin:4px 0 12px"><b style="font-size:21px;letter-spacing:-.4px">My membership</b>${c?`<span class="pill ${s.cls}">${s.k==='expired'?'Expired':s.k==='ending'?'Ending soon':'● Active'}</span>`:''}</div>${card}
      ${c?`<div class="card" style="margin-top:10px;padding:4px 14px;border-radius:16px"><div class="prow"><span class="mut">Amount paid</span><b class="num">${c.mode==='Not paid yet'?'<span style="color:var(--org)">Due '+rs(c.price-c.discount)+'</span>':rs(c.paid)}</b></div><div class="prow"><span class="mut">Paid by</span><b>${esc(c.mode)}</b></div></div>
      <div class="row" style="margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)"><span class="av" style="width:30px;height:30px;border-radius:9px;background:var(--limeD)">${ic('sync',15,'#C8FF3E')}</span><div><b style="font-size:12.5px">Updated by your gym</b><div class="small mut">${esc(c.by)} · ${fmt(c.addedOn)}</div></div></div>`:''}
      <div class="hint o" style="margin-top:10px;font-size:12px">${ic('info',16,'#FF7A2F')}<span>Your gym manages your membership. To renew, visit the front desk or contact the gym.</span></div>
      <div class="row" style="margin-top:10px"><span class="btn ghost" style="flex:1;font-size:13px">${ic('phone',15)} Call gym</span><span class="btn wa" style="flex:1;font-size:13px">${ic('wa',15,'#6EE59A')} WhatsApp</span></div>`;
  } else {
    const vis = S.plans.filter(x=>x.visible);
    inner = `<b style="font-size:19px;letter-spacing:-.4px;display:block;margin:4px 0 4px">Membership plans</b><p class="small mut" style="margin:0 0 8px;line-height:1.45">Set by Ironline Fitness. Pay at the front desk; the gym activates your plan.</p>` +
      (vis.map(x=>{const mine = c && c.planId===x.id && s.k!=='expired'; return `<div class="card" style="padding:12px 14px;border-radius:16px;margin-top:8px;${mine?'border-color:#5E7A2A':''}"><div class="row sp"><b>${esc(x.name)}</b>${mine?'<span class="pill ok">Your plan</span>':'<span class="small" style="color:var(--lime);font-weight:700">Ask gym</span>'}</div><div class="row" style="align-items:baseline;gap:5px;margin-top:4px"><span class="num" style="font-size:20px;font-weight:800">${rs(x.price)}</span><span class="small mut">/ ${x.months} mo</span></div><div class="small mut">${x.joining?'+ '+rs(x.joining)+' joining fee':'No joining fee'}</div></div>`}).join('') || '<p class="mut">Your gym has not published any plans yet.</p>');
  }
  $('#phone').innerHTML = `<div class="sbar"><span>9:41</span><span>●●● ▮</span></div>
    <div class="notif" id="notif"><span class="av" style="width:34px;height:34px;border-radius:10px;background:var(--lime)">${ic('check',17,'#111',3)}</span><div style="flex:1;min-width:0"><b style="font-size:13px">${esc(note?.title||'')}</b><div class="small mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(note?.body||'')}</div></div><span class="small dim">now</span></div>
    <div class="ptabs" role="group" aria-label="Member app screen"><button type="button" data-pv="membership" aria-pressed="${pvTab==='membership'}">My membership</button><button type="button" data-pv="plans" aria-pressed="${pvTab==='plans'}">Gym plans</button></div>
    <div class="pbody">${inner}</div>`;
  if (note){ requestAnimationFrame(()=>requestAnimationFrame(()=>$('#notif').classList.add('show'))); clearTimeout(notifT); notifT = setTimeout(()=>{ const n=$('#notif'); n&&n.classList.remove('show'); }, 4200); }
}

// ---------- render & events
function render(){
  renderNav();
  $('#main').innerHTML = view==='dashboard'?vDashboard():view==='members'?vMembers():view==='member'?vMember():view==='plans'?vPlans():view==='attendance'?vAttendance():vSupport();
  renderPhone();
}

function readForm(){
  form.planId = $('#fPlan').value; form.start = $('#fStart').value; form.end = $('#fEnd').value;
  form.price = Number($('#fPrice').value); form.discount = Number($('#fDisc').value); form.paid = Number($('#fPaid').value);
  form.by = $('#fBy').value; form.note = $('#fNote').value; form.wa = $('#fWa').checked; form.notify = $('#fNotify').checked;
}
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ q = e.target.value; const pos = e.target.selectionStart; $('#main').innerHTML = vMembers(); const i = $('#q'); i.focus(); i.setSelectionRange(pos,pos); return; }
  if (!form || view!=='member') return;
  const id = e.target.id;
  if (['fPrice','fDisc'].includes(id)){ readForm(); if (!form.paidEdited) { form.paid = Math.max(0, form.price - form.discount); $('#fPaid').value = form.paid; } }
  if (id==='fPaid') { form.paidEdited = true; readForm(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id==='pvSel'){ S.pv = e.target.value; save(); renderPhone(); return; }
  if (!form || view!=='member') return;
  if (id==='fPlan' || id==='fStart'){
    readForm(); const p = plan(form.planId), m = member(memberId), first = !m.hist.length;
    form.end = endFor(form.start, p.months); form.endEdited = false;
    if (id==='fPlan'){ form.price = p.price + (first?p.joining:0); form.paidEdited=false; form.paid = Math.max(0, form.price - form.discount); }
    $('#main').innerHTML = vMember();
  }
  if (id==='fEnd'){ readForm(); form.endEdited = true; }
});
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.id==='reply') sendReply();
  if (e.key==='Escape' && $('#modalRoot').innerHTML) $('#modalRoot').innerHTML = '';
});
function sendReply(text){
  const t = S.tickets.find(x=>x.id===ticketId); const v = (text ?? $('#reply').value).trim(); if (!v) return;
  t.msgs.push({me:true, text:v, t:'Just now', by:'Priya'}); save(); render(); toast('Reply sent to ' + member(t.member).name.split(' ')[0] + "'s app");
}
document.addEventListener('click', e => {
  const el = e.target.closest('button,tr.click'); if (!el) return;
  const d = el.dataset;
  if (d.nav){ go(d.nav); return; }
  if (d.member){ e.stopPropagation(); form = null; go('member', d.member); return; }
  if (d.tab){ memberTab = d.tab; $('#main').innerHTML = vMembers(); return; }
  if (d.mode){ readForm(); form.mode = d.mode; if (d.mode==='Not paid yet'){ form.paid = 0; form.paidEdited = true; } else if (form.paid===0){ form.paidEdited=false; form.paid=Math.max(0,form.price-form.discount);} $('#main').innerHTML = vMember(); return; }
  if (d.pv){ pvTab = d.pv; renderPhone(); return; }
  if (d.vis){ const p = plan(d.vis); p.visible = !p.visible; save(); render(); toast(p.visible ? `${p.name} now shows in the member app` : `${p.name} is hidden from the member app`); return; }
  if (d.edit){ planModal(d.edit); return; }
  if (d.ticket){ ticketId = d.ticket; render(); return; }
  if (d.quick){ sendReply(d.quick); return; }
  if (d.resolve){ S.tickets.find(x=>x.id===d.resolve).open = false; save(); render(); toast('Ticket marked as resolved'); return; }
  if (d.approve){ const r = S.requests.find(x=>x.id===d.approve); S.requests = S.requests.filter(x=>x!==r); const id = 'IRF-' + (20419 + S.members.length); S.members.unshift({id, name:r.name, phone:r.phone, joined:iso(TODAY), hist:[]}); save(); form=null; toast(`${r.name} approved. Now add their plan.`); go('member', id); return; }
  if (d.reject){ S.requests = S.requests.filter(x=>x.id!==d.reject); save(); render(); toast('Join request declined'); return; }
  if (d.saveplan !== undefined){
    const name = $('#pName').value.trim(), months = Number($('#pMonths').value), price = Number($('#pPrice').value), joining = Number($('#pJoin').value)||0;
    const err = !name ? 'Enter a plan name.' : !(months>=1) ? 'Months must be 1 or more.' : !(price>0) ? 'Enter a price above ₹0.' : '';
    if (err){ $('#pErr').textContent = err; return; }
    const features = $('#pFeat').value.split(',').map(s=>s.trim()).filter(Boolean), visible = $('#pVis').checked;
    if (d.saveplan){ Object.assign(plan(d.saveplan), {name, months, price, joining, features, visible}); }
    else S.plans.push({id:'p'+Date.now(), name, months, price, joining, features, visible});
    save(); $('#modalRoot').innerHTML = ''; render(); toast(visible ? `${name} saved and shown in the member app` : `${name} saved (hidden from app)`); pvTab='plans'; renderPhone(); return;
  }
  switch (d.act){
    case 'newPlan': planModal(); break;
    case 'closeModal': $('#modalRoot').innerHTML = ''; break;
    case 'toRequests': memberTab='requests'; go('members'); break;
    case 'openPrev': $('#preview').classList.add('open'); break;
    case 'scan': {
      const m = member($('#scanSel').value), s = status(m);
      const result = (s.k==='expired'||s.k==='none') ? 'bad' : s.k==='ending' ? 'warn' : 'ok';
      const text = result==='bad' ? (s.k==='none'?'Blocked · no plan':'Blocked · expired') : result==='warn' ? 'Allowed · ends soon' : 'Allowed';
      const mins = 53 + S.checkins.length - 5; const time = `${6 + Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')} am`;
      lastScan = {id:m.id, result, text, time}; S.checkins.unshift({time, id:m.id, result, text}); save(); render(); break;
    }
    case 'send': sendReply(); break;
  }
  if (el.id==='fSave'){
    readForm();
    const err = !form.start || !form.end ? 'Choose start and end dates.' : form.end < form.start ? 'End date must be after the start date.' : '';
    if (err){ $('#fErr').textContent = err; return; }
    const m = member(memberId), p = plan(form.planId);
    m.hist.push({planId:form.planId, start:form.start, end:form.end, price:form.price, discount:form.discount, paid:form.mode==='Not paid yet'?0:form.paid, mode:form.mode, by:form.by, addedOn:iso(TODAY), note:form.note});
    const notify = form.notify, wa = form.wa;
    S.pv = m.id; pvTab='membership'; save(); form = null;
    render();
    renderPhone(notify ? {title:'Membership updated', body:`Ironline Fitness · ${p.name} till ${fmt(m.hist[m.hist.length-1].end)}`} : null);
    $('#preview').classList.add('open');
    toast(`Saved. ${m.name.split(' ')[0]}'s app is updated.${wa?' Receipt sent on WhatsApp.':''}`);
  }
  if (el.id==='closePrev') $('#preview').classList.remove('open');
  if (el.id==='reset'){ S = seed(); save(); form=null; lastScan=null; memberTab='all'; q=''; go('dashboard'); toast('Sample data restored'); }
});

render();
})();
</script>
