<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GymMantra logo · Dumbbell M</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#C8FF3E}a:hover{color:#E4FF9A}
</style>
</helmet>
<div style="width: 960px; height: 720px; box-sizing: border-box; background: #0F1110; color: #F3F6F1; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px">
    <p style="margin: 0; align-self: flex-start; font-size: 13px; letter-spacing: 0.18em; font-weight: 800; color: {{accent}}">DIRECTION B · DUMBBELL M</p>
    <svg viewBox="0 0 200 200" width="260" height="260" role="img" aria-label="GymMantra mark: an M built from dumbbell plates">
      <rect x="18" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect>
      <rect x="52" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect>
      <rect x="130" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect>
      <rect x="154" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect>
      <path d="M72 72 L100 120 L128 72" fill="none" stroke="{{accent}}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="font-size: 56px; font-weight: 900; letter-spacing: -1.5px; line-height: 1">Gym<span style="color: {{accent}}">Mantra</span></div>
      <div style="font-size: 19px; font-weight: 500; color: #AEB4AE">Fitness ka sahi mantra.</div>
    </div>
  </div>
  <div style="background: #161917; border-left: 1px solid #262B27; padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 22px">
    <p style="margin: 0; font-size: 12px; letter-spacing: 0.16em; font-weight: 800; color: #8C948D">APP ICON</p>
    <div style="display: flex; gap: 20px; align-items: center">
      <div style="width: 144px; height: 144px; border-radius: 34px; background: #0F1110; border: 1px solid #2A2F2B; display: grid; place-items: center">
        <svg viewBox="0 0 200 200" width="100" height="100" aria-hidden="true"><rect x="18" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><rect x="52" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="130" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="154" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><path d="M72 72 L100 120 L128 72" fill="none" stroke="{{accent}}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="width: 144px; height: 144px; border-radius: 34px; background: {{accent}}; display: grid; place-items: center">
        <svg viewBox="0 0 200 200" width="100" height="100" aria-hidden="true"><rect x="18" y="44" width="28" height="112" rx="10" fill="#0F1110"></rect><rect x="52" y="64" width="18" height="72" rx="7" fill="#0F1110"></rect><rect x="130" y="64" width="18" height="72" rx="7" fill="#0F1110"></rect><rect x="154" y="44" width="28" height="112" rx="10" fill="#0F1110"></rect><path d="M72 72 L100 120 L128 72" fill="none" stroke="#0F1110" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </div>
    <p style="margin: 8px 0 0; font-size: 12px; letter-spacing: 0.16em; font-weight: 800; color: #8C948D">SMALL SIZES</p>
    <div style="display: flex; gap: 18px; align-items: flex-end">
      <div style="width: 72px; height: 72px; border-radius: 18px; background: #0F1110; border: 1px solid #2A2F2B; display: grid; place-items: center"><svg viewBox="0 0 200 200" width="50" height="50" aria-hidden="true"><rect x="18" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><rect x="52" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="130" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="154" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><path d="M72 72 L100 120 L128 72" fill="none" stroke="{{accent}}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
      <div style="width: 48px; height: 48px; border-radius: 12px; background: #0F1110; border: 1px solid #2A2F2B; display: grid; place-items: center"><svg viewBox="0 0 200 200" width="34" height="34" aria-hidden="true"><rect x="18" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><rect x="52" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="130" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="154" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><path d="M72 72 L100 120 L128 72" fill="none" stroke="{{accent}}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #0F1110; border: 1px solid #2A2F2B; display: grid; place-items: center"><svg viewBox="0 0 200 200" width="24" height="24" aria-hidden="true"><rect x="18" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><rect x="52" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="130" y="64" width="18" height="72" rx="7" fill="#F3F6F1"></rect><rect x="154" y="44" width="28" height="112" rx="10" fill="#F3F6F1"></rect><path d="M72 72 L100 120 L128 72" fill="none" stroke="{{accent}}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    </div>
    <p style="margin: 8px 0 0; font-size: 12px; letter-spacing: 0.16em; font-weight: 800; color: #8C948D">ON LIGHT</p>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 20px 24px; display: flex; align-items: center; gap: 16px">
      <svg viewBox="0 0 200 200" width="56" height="56" aria-hidden="true"><rect x="18" y="44" width="28" height="112" rx="10" fill="#0F1110"></rect><rect x="52" y="64" width="18" height="72" rx="7" fill="#0F1110"></rect><rect x="130" y="64" width="18" height="72" rx="7" fill="#0F1110"></rect><rect x="154" y="44" width="28" height="112" rx="10" fill="#0F1110"></rect><path d="M72 72 L100 120 L128 72" fill="none" stroke="#4D7C0F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="font-size: 32px; font-weight: 900; letter-spacing: -0.8px; color: #0F1110">Gym<span style="color: #4D7C0F">Mantra</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF3E","options":["#C8FF3E","#FF7A2F","#5BB9FF"]},"$preview":{"width":960,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8FF3E' };
  }
}
</script>
</body>
</html>
