name: gymmantra
description: GymMantra member app. Fitness ka sahi mantra.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  video_player: ^2.9.1
  google_sign_in: ^6.2.1
  path_provider: ^2.1.4
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  share_plus: ^10.1.4
  gal: ^2.3.1
  file_picker: ^10.3.7
  pdfx: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/india.json
  fonts:
    # Plus Jakarta Sans (SIL Open Font License 1.1). Hindi text uses the phone's Devanagari font.
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
